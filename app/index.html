<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>Birth Face</title>
  <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="mark">☉</span><div><b>Birth Face</b><small>the face of the sky rising at your birth</small></div></div>
      <nav class="people" id="people"></nav>
      <button type="button" class="btn" id="add">+ Add a person</button>
      <p class="side-note">Everything stays on this computer.</p>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog id="dlg">
    <form id="pf" method="dialog" autocomplete="off">
      <h2 id="pf-title">Add a person</h2>
      <label>Name <input name="name" required></label>
      <div class="row"><label>Date of birth <input name="date" type="date" required min="1900-01-01" max="2100-12-31"></label>
        <label>Exact time of birth <input name="time" type="time" step="1" required></label></div>
      <label class="place">Place of birth <input name="place" id="pf-place" placeholder="Start typing a city…">
        <ul id="pf-sugg" class="sugg" hidden></ul><small id="pf-info"></small></label>
      <label>Sex <select name="sex"><option value="m">Male</option><option value="f">Female</option></select></label>
      <p class="err" id="pf-err" role="alert"></p>
      <div class="acts"><button type="button" class="btn ghost" id="pf-del" hidden>Delete</button><span></span><button type="button" class="btn ghost" id="pf-cancel">Cancel</button><button type="submit" class="btn">Save</button></div>
    </form>
  </dialog>

  <script src="vendor/astronomy.browser.min.js?v=35"></script>
  <script src="data/cities.js?v=35"></script>
  <script src="js/arcana.js?v=35"></script>
  <script src="js/matrix.js?v=35"></script>
  <script src="js/humandesign.js?v=35"></script>
  <script src="js/astro.js?v=35"></script>
  <script src="js/extras.js?v=35"></script>
  <script src="js/daily.js?v=35"></script>
  <script src="js/dignity.js?v=35"></script>
  <script src="js/shem/index.js?v=35"></script>
  <script src="js/mansion/index.js?v=35"></script>
  <script src="js/lilly/index.js?v=35"></script>
  <script src="js/faces.js?v=35"></script>
  <script src="js/blendface.js?v=35"></script>
  <script src="js/rising.js?v=35"></script>
  <script src="js/describe.js?v=35"></script>
  <script src="js/app.js?v=35"></script>
</body>
</html>
